<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next-Videos Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body class="theme-sober">
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <img src="icons/icon48.png" alt="Next-Videos Logo" class="brand-logo-img" />
        </div>
        <span class="brand-title">Next-Videos</span>
      </div>
      <div class="header-actions">
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-body">
      <!-- URL Input Section -->
      <div class="input-card">
        <div class="input-group">
          <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <input type="text" id="videoUrlInput" placeholder="Paste video URL or auto-detected tab..." />
          <button id="pasteBtn" class="action-btn text-btn">Paste</button>
        </div>
        <button id="fetchBtn" class="primary-btn">
          <span id="fetchBtnText">Analyze Video</span>
          <div id="fetchSpinner" class="spinner hidden"></div>
        </button>
      </div>

      <!-- Active Persistent Download Card -->
      <div id="activeDownloadCard" class="preview-card hidden" style="border: 1px solid rgba(0, 153, 222, 0.4); background: rgba(0, 71, 186, 0.08);">
        <div class="thumb-wrapper">
          <img id="activeThumb" src="icons/icon128.png" alt="Video Thumbnail" />
          <span id="activeDuration" class="duration-tag">0:00</span>
          <span id="activePlatformTag" class="platform-tag">Active</span>
        </div>
        <div class="video-meta">
          <h3 id="activeTitle" class="video-title">Downloading Video...</h3>
          <p id="activeQuality" class="video-channel" style="color: #0099DE; font-weight: 600;">1080p HD • MP4</p>
        </div>

        <div class="progress-section" style="margin-top: 10px;">
          <div class="progress-info">
            <span id="activeProgressStatus" style="font-weight: 600;">Downloading in background...</span>
            <span id="activeProgressPercent" style="color: #0099DE; font-weight: 700;">0%</span>
          </div>
          <div class="progress-bar-bg" style="height: 8px; margin-top: 6px;">
            <div id="activeProgressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
        </div>

        <button id="dismissActiveBtn" class="secondary-btn" style="width: 100%; margin-top: 12px; justify-content: center;">
          Download Another Video
        </button>
      </div>

      <!-- Error Message -->
      <div id="errorBox" class="alert-box error hidden">
        <span id="errorText">Error fetching video details.</span>
      </div>

      <!-- Video Preview Card -->
      <div id="previewCard" class="preview-card hidden">
        <div class="thumb-wrapper">
          <img id="videoThumb" src="" alt="Thumbnail" />
          <span id="videoDuration" class="duration-tag">0:00</span>
          <span id="platformTag" class="platform-tag">YouTube</span>
        </div>
        <div class="video-meta">
          <h3 id="videoTitle" class="video-title">Video Title</h3>
          <p id="videoChannel" class="video-channel">Channel Name</p>
        </div>

        <!-- Audio Track Selector -->
        <div id="audioTrackSection" class="audio-track-group hidden">
          <label for="audioTrackSelect">Audio Track:</label>
          <select id="audioTrackSelect">
            <option value="default">Default Audio (Best)</option>
            <option value="all">All Audio Tracks (MKV)</option>
          </select>
        </div>

        <!-- Formats List -->
        <div class="formats-section">
          <p class="section-label">Select Download Format:</p>
          <div id="formatsContainer" class="formats-grid">
            <!-- Format buttons injected dynamically -->
          </div>
        </div>

        <!-- Download Progress -->
        <div id="progressSection" class="progress-section hidden">
          <div class="progress-info">
            <span id="progressStatus">Downloading...</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progressBarFill" class="progress-bar-fill"></div>
          </div>
        </div>
      </div>

      <!-- Quick Platform Shortcuts -->
      <div class="footer-shortcuts">
        <button id="openAppBtn" class="secondary-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          Open in Full Web App
        </button>
      </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h4>Extension Settings</h4>
          <button id="closeSettingsBtn" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <label for="serverUrlInput">Next-Videos Server URL:</label>
          <input type="text" id="serverUrlInput" value="http://localhost:3005" placeholder="http://localhost:3005" />
          <small>Default local backend is <code>http://localhost:3005</code>.</small>
        </div>
        <div class="modal-footer">
          <button id="saveSettingsBtn" class="primary-btn sm">Save Settings</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
